<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awais Profile Card</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  
    
<div class="container">
    <div class="image">
        <img src="https://static.vecteezy.com/system/resources/previews/080/355/575/non_2x/futuristic-black-and-red-tech-background-with-sharp-diagonal-lines-and-digital-glow-perfect-for-technology-cyber-and-gaming-themes-dark-modern-abstract-vector.jpg" alt="">
    </div>

    <div class="profile-img">
        <img src="awais.png" alt="Awais">
    </div>
    <div class="profile-info">

        <h1>Awais Ali</h1>
        <h3>Frontend Developer</h3>
        <p>I create Responsive and user-friendly websites</p>
        <p>with clean code and modern designs.</p>
    </div>
    <hr class="divider">
    <div class="profile-skills">
        
        <h1>Skills</h1>
        <div class="skills">

            <h5>HTML</h5>
            <h5>CSS</h5>
            <h5>JavaScript</h5>
            <h5>Bootstarp</h5>
            <h5>Git</h5>


        </div>

        <div class="profile-contact">
            <hr class="divider">
            <h1>Contact with me</h1>
            <div class="profile-social-links">
                <img src="linkedin.png" alt="LinkedIn" >
                <img src="github.png" alt="Github" >
                <img src="twitter.png" alt="Twitter">
                <img src="instagram.png" alt="instagram">
                <img src="youtube.png" alt="youtube">
            </div>
            <div class="contact-button">

                <button>
                    Contact Me
                </button>
            </div>
            
        </div>
    </div>

</div>



</body>
</html>
